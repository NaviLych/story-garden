<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>走廊 · 托马物语</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <style>
        .scene-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem 5rem;
        }

        .scene-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .scene-title {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .scene-time {
            color: rgba(255, 236, 209, 0.5);
            font-size: 0.9rem;
        }

        .character-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .character-sprite {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .dialog-box {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .name-tag {
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .dialog-text {
            color: var(--accent);
            line-height: 1.8;
        }

        .action-grid {
            display: grid;
            gap: 0.8rem;
        }

        .action-btn {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.1), rgba(255, 107, 53, 0.05));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.2), rgba(255, 107, 53, 0.1));
            border-color: rgba(255, 157, 0, 0.6);
            transform: translateX(5px);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-cost {
            font-size: 0.85rem;
            color: #ff9d00;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            font-size: 0.9rem;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .status-mini {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .status-mini span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .map-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            margin-bottom: 1rem;
        }

        .map-btn {
            background: rgba(255, 157, 0, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: var(--accent);
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .map-btn.active {
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            border-color: transparent;
        }

        .map-btn:hover:not(.active) {
            background: rgba(255, 157, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div class="scene-container">
        <div class="top-bar">
            <button class="back-btn" onclick="goToMap()">🗺️ 地图</button>
            <div class="status-mini">
                <span>❤️ <span id="aff-display">30</span></span>
                <span>⚡ <span id="nrg-display">100</span></span>
            </div>
        </div>

        <!-- 快速导航 -->
        <div class="map-nav">
            <button class="map-btn active">🏡 走廊</button>
            <button class="map-btn" onclick="goToScene('garden')">🌿 庭院</button>
            <button class="map-btn" onclick="goToScene('kitchen')">🍱 厨房</button>
            <button class="map-btn" onclick="goToScene('street')">🏮 街头</button>
        </div>

        <div class="scene-header">
            <h1 class="scene-title">社奉行邸 · 走廊</h1>
            <p class="scene-time" id="time-display">正午</p>
        </div>

        <!-- 角色立绘区 -->
        <div class="character-area">
            <img src="../../assets/images/bg_corridor.jpg" alt="托马" class="character-sprite">
        </div>

        <!-- 对话区 -->
        <div class="dialog-box" id="main-dialog">
            <div class="name-tag">托马</div>
            <div class="dialog-text" id="dialog-content">
                「来，先坐在这里歇口气。我去给你倒茶，刚沏的，还热着呢。」

他提着菜走向厨房，脚步轻快得完全不像是刚从外面采购回来。

阳光透过廊檐洒进来，在木质地板上投下斑驳的光影。空气中漂浮着淡淡的茶香。
            </div>
        </div>

        <!-- 行动选择 -->
        <div class="action-grid" id="action-list">
            <button class="action-btn" onclick="doAction('wait')">
                <span>安静坐着等托马回来</span>
                <span class="action-cost">⚡ -0</span>
            </button>
            <button class="action-btn" onclick="doAction('look')">
                <span>四处打量一下周围的环境</span>
                <span class="action-cost">⚡ -5</span>
            </button>
            <button class="action-btn" onclick="doAction('help')">
                <span>去厨房看看要不要帮忙</span>
                <span class="action-cost">⚡ -10</span>
            </button>
            <button class="action-btn" onclick="doAction('rest')">
                <span>靠在廊柱上打个盹</span>
                <span class="action-cost">⚡ +20</span>
            </button>
        </div>
    </div>

    <script>
        let gameState = JSON.parse(localStorage.getItem('thomaStory_save') || '{}');

        const timeNames = {
            morning: '清晨',
            noon: '正午',
            afternoon: '午后',
            evening: '傍晚',
            night: '夜晚'
        };

        function updateUI() {
            document.getElementById('aff-display').textContent = gameState.affection || 30;
            document.getElementById('nrg-display').textContent = gameState.energy || 100;
            document.getElementById('time-display').textContent = timeNames[gameState.time] || '正午';
        }

        function saveGame() {
            localStorage.setItem('thomaStory_save', JSON.stringify(gameState));
        }

        function goToMap() {
            window.location.href = 'index.html#game-main';
        }

        function goToScene(scene) {
            window.location.href = `scene_${scene}.html`;
        }

        function doAction(action) {
            const dialog = document.querySelector('.dialog-text');
            const actions = document.getElementById('action-list');

            switch(action) {
                case 'wait':
                    dialog.innerHTML = '你安静地坐在廊下，看着风吹过庭院的樱树。

花瓣打着旋儿飘落到走廊上，有一片甚至落在了你的膝头。

「久等了！」

托马端着茶盘走了过来，上面放着两杯煎茶，还有一小碟樱饼。

「来尝尝这个，是我自己做的。外面卖的总是太甜了，我调整过配方。」

❤️ 好感度 +5';
                    gameState.affection += 5;
                    gameState.flags.teaServed = true;
                    break;

                case 'look':
                    dialog.innerHTML = '你站起身四处打量。

走廊的布置雅致而不张扬，处处透着神里家的品味。

廊下挂着一个旧草帽，看起来不像是装饰用的。帽檐上还缝着一个有点幼稚的樱花瓣刺绣。

「啊，那个是我的。」

托马不知什么时候回来了，有点不好意思地挠挠头：

「刚来稻妻的时候晒黑了好几个度，就买了这个帽子。现在倒是很少戴了。」

❤️ 好感度 +3
📦 获得物品：【托马的旧草帽】*1';
                    gameState.affection += 3;
                    gameState.energy -= 5;
                    gameState.inventory.push('old-hat');
                    break;

                case 'help':
                    dialog.innerHTML = '你来到厨房。

托马正系着围裙，动作利落地在灶台前忙碌着，完全看不出平时那个爽朗的家政官模样。

「咦？你怎么过来了？没事，我一个人忙得过来啦。」

话是这么说，但他看到你愿意帮忙，眼睛却亮了一下。

「那就……帮我把那个盘子递过来吧？谢啦！」

两个人一起准备茶点，效率快了不少。聊着天，时间不知不觉就过去了。

❤️ 好感度 +8
⚡ 精力 -10';
                    gameState.affection += 8;
                    gameState.energy -= 10;
                    break;

                case 'rest':
                    dialog.innerHTML = '你靠在廊柱上，伴着温暖的阳光打了个盹。

不知睡了多久，醒来时身上多了一件外套。

「看你睡着了，就给你披了件。」

托马坐在不远处，手里织着什么东西，看到你醒了，露出一个温和的笑容：

「休息好了？茶刚好温着，现在喝正合适。」

⚡ 精力 +20
❤️ 好感度 +5';
                    gameState.energy = Math.min(100, gameState.energy + 20);
                    gameState.affection += 5;
                    break;
            }

            saveGame();
            updateUI();

            // 隐藏动作按钮，显示继续
            actions.innerHTML = '';
            const continueBtn = document.createElement('button');
            continueBtn.className = 'action-btn';
            continueBtn.innerHTML = '<span>继续</span><span class="action-cost">→</span>';
            continueBtn.onclick = continueAfterAction;
            actions.appendChild(continueBtn);
        }

        function continueAfterAction() {
            const dialog = document.querySelector('.dialog-text');
            const actions = document.getElementById('action-list');
            const sceneTitle = document.querySelector('.scene-title');
            
            // 如果还没进入茶会阶段，进入茶会时间
            if (!gameState.flags.teaPhase) {
                gameState.flags.teaPhase = true;
                gameState.time = 'afternoon';
                
                sceneTitle.textContent = '社奉行邸 · 茶会时间';
                dialog.innerHTML = '阳光穿过廊道，在茶碗里投下细碎的光斑。\n\n托马坐在你对面，端起茶杯轻轻吹了吹。\n\n「说起来，你是第一次来稻妻吧？有什么想去的地方吗？」\n\n他的手指在杯沿轻轻摩挲，碧绿色的眼睛看着你，带着温和的笑意。';
                
                // 茶会阶段的选项
                actions.innerHTML = '';
                
                const options = [
                    { text: '「鸣神大社，想去看看樱花。」', aff: 3, key: 'shrine' },
                    { text: '「想尝尝稻妻的特色料理。」', aff: 5, key: 'food' },
                    { text: '「其实……对你更感兴趣。」', aff: 8, key: 'curious' },
                    { text: '（低头喝茶，不说话）', aff: 2, key: 'quiet' }
                ];
                
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.innerHTML = `<span>${opt.text}</span><span class="action-cost">❤️ +${opt.aff}</span>`;
                    btn.onclick = () => teaChoice(opt);
                    actions.appendChild(btn);
                });
                
                saveGame();
                updateUI();
            }
        }
        
        function teaChoice(opt) {
            const dialog = document.querySelector('.dialog-text');
            const actions = document.getElementById('action-list');
            
            gameState.affection += opt.aff;
            gameState.flags.teaChoice = opt.key;
            
            let response = '';
            switch(opt.key) {
                case 'shrine':
                    response = '「鸣神大社啊，确实是个好地方。」\n\n托马的眼中闪过一丝怀念：「下次我带你去吧，我知道一条人少的小路，沿途的风景比山顶还好看。」\n\n「而且，八重神子大人那里的……」他忽然压低声音：「那里的油豆腐，全稻妻最好吃。」';
                    break;
                case 'food':
                    response = '托马眼睛一下子亮了：「那你可问对人了！」\n\n「志村屋的味增汤、乌冬亭的天妇罗、还有小吃摊的三彩团子——说起来，你现在想吃吗？我现在就可以给你做！」\n\n他说着就要站起来，一副跃跃欲试的样子。';
                    break;
                case 'curious':
                    response = '托马愣了一下，然后轻笑出声，耳尖微微泛红。\n\n「……哦？」他饶有兴致地看着你，尾音带着一点笑意上扬：「那你想知道什么？」\n\n「我从哪里来？喜欢吃什么？还是——」他往前微微倾身，声音放得更低：「有没有喜欢的人？」';
                    break;
                case 'quiet':
                    response = '你没有说话，只是端起茶杯小口喝着。\n\n温热的茶流过喉咙，带着一点樱花的香气。\n\n托马也没有催促，只是安静地陪着你。风吹过庭院，樱花瓣飘落在廊下，时间仿佛慢了下来。\n\n过了一会儿，他轻声说：「……其实，这样也挺好。」';
                    break;
            }
            
            dialog.innerHTML = response;
            
            // 茶会结束选项
            actions.innerHTML = '';
            const nextBtn = document.createElement('button');
            nextBtn.className = 'action-btn';
            nextBtn.innerHTML = '<span>（茶会结束，接下来……）</span><span class="action-cost">→</span>';
            nextBtn.onclick = endTeaParty;
            actions.appendChild(nextBtn);
            
            saveGame();
            updateUI();
        }
        
        function endTeaParty() {
            const dialog = document.querySelector('.dialog-text');
            const actions = document.getElementById('action-list');
            
            dialog.innerHTML = '夕阳把走廊染成了温暖的金色。\n\n托马收拾好茶盘，回头对你笑了笑：「今天真是开心，很久没有这么悠闲地喝过茶了。」\n\n「接下来你打算做什么？要在社奉行逛逛，还是我带你去城里走走？」';
            
            actions.innerHTML = '';
            
            const places = [
                { name: '🌿 去庭院走走', scene: 'garden' },
                { name: '🍱 去厨房看看', scene: 'kitchen' },
                { name: '🏮 去鸣神岛街头', scene: 'street' },
                { name: '😴 就在这里再坐一会儿', scene: 'stay' }
            ];
            
            places.forEach(place => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerHTML = `<span>${place.name}</span><span class="action-cost">→</span>`;
                btn.onclick = () => {
                    if (place.scene === 'stay') {
                        dialog.innerHTML = '你选择继续坐在廊下。\n\n托马也没有走，他拿来了针线和布料，坐在你旁边开始缝补什么。\n\n「是给流浪小猫做的小窝。」他笑着说：「最近天气凉了，它们总在夜里发抖。」\n\n夕阳照着他认真的侧脸，你们就这样安静地坐着，直到星星爬上夜空。\n\n✨ 【第一章 · 初遇】完成';
                        actions.innerHTML = '';
                        gameState.flags.chapter1Complete = true;
                        saveGame();
                    } else {
                        window.location.href = `scene_${place.scene}.html`;
                    }
                };
                actions.appendChild(btn);
            });
        }

        // 初始化场景内容
        function initSceneContent() {
            const dialog = document.getElementById('dialog-content');
            const actions = document.getElementById('action-list');
            
            // 如果已经完成茶会
            if (gameState.flags.teaPhase) {
                if (gameState.time === 'evening') {
                    // 傍晚回来
                    sceneTitle.textContent = '社奉行邸 · 傍晚';
                    dialog.innerHTML = '夕阳把走廊染成了温暖的金色。\n\n托马端着茶走了过来，在你身边坐下。\n\n「今天玩得开心吗？」他笑着问，碧绿色的眼睛在夕阳下闪闪发光：「我挺开心的……很久没有像今天这样，一整天都陪着某个人了。」\n\n✨ 【第一章 · 初遇】完成';
                    actions.innerHTML = '';
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.innerHTML = '<span>返回主菜单</span><span class="action-cost">→</span>';
                    btn.onclick = () => window.location.href = 'index.html';
                    actions.appendChild(btn);
                } else {
                    // 茶会进行中
                    sceneTitle.textContent = '社奉行邸 · 茶会时间';
                    dialog.innerHTML = '阳光穿过廊道，在茶碗里投下细碎的光斑。\n\n托马坐在你对面，端起茶杯轻轻吹了吹。\n\n「说起来，你是第一次来稻妻吧？有什么想去的地方吗？」';
                    
                    // 显示茶会选项
                    actions.innerHTML = '';
                    const options = [
                        { text: '「鸣神大社，想去看看樱花。」', aff: 3, key: 'shrine' },
                        { text: '「想尝尝稻妻的特色料理。」', aff: 5, key: 'food' },
                        { text: '「其实……对你更感兴趣。」', aff: 8, key: 'curious' },
                        { text: '（低头喝茶，不说话）', aff: 2, key: 'quiet' }
                    ];
                    options.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'action-btn';
                        btn.innerHTML = `<span>${opt.text}</span><span class="action-cost">❤️ +${opt.aff}</span>`;
                        btn.onclick = () => teaChoice(opt);
                        actions.appendChild(btn);
                    });
                }
            }
            // 否则显示初始四个选项
        }

        // 初始化
        updateUI();
        initSceneContent();
    </script>
</body>
</html>
