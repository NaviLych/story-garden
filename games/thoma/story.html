<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>序章 · 托马物语</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <style>
        .story-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem 5rem;
        }

        .dialog-box {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            min-height: 150px;
        }

        .dialog-box::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #ff9d00, #ff6b35);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .name-tag {
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .text-content {
            color: var(--accent);
            line-height: 1.8;
            font-size: 1.05rem;
            white-space: pre-line;
        }

        .choices-container {
            margin-top: 2rem;
            display: grid;
            gap: 0.8rem;
        }

        .choice-btn {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.1), rgba(255, 107, 53, 0.05));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            width: 100%;
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
        }

        .choice-btn:hover {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.2), rgba(255, 107, 53, 0.1));
            border-color: rgba(255, 157, 0, 0.6);
            transform: translateX(8px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.15);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            font-size: 0.9rem;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .status-mini {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .status-mini span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scene-image {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div class="story-container">
        <div class="top-bar">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <div class="status-mini">
                <span>❤️ <span id="aff-display">30</span></span>
                <span>⚡ <span id="nrg-display">100</span></span>
            </div>
        </div>

        <!-- 场景图 -->
        <img src="../../assets/images/bg_corridor.jpg" alt="稻妻清晨" class="scene-image fade-in">

        <!-- 对话框 -->
        <div class="dialog-box fade-in" id="dialog">
            <div class="name-tag" id="speaker-tag">序章</div>
            <div class="text-content" id="dialog-text">
                晨雾笼罩着鸣神岛。

社奉行邸的木门缓缓推开，你提着简单的行李站在门口。

按照友人的介绍信，你将在这里暂住一段时间，帮忙处理一些文书工作。

就在你犹豫着要不要敲门时，身后传来了开朗的声音——
            </div>
        </div>

        <!-- 选项 -->
        <div id="choices" class="choices-container fade-in">
            <button class="choice-btn" onclick="makeChoice(0)">
                「请问……这里是社奉行邸吗？」
            </button>
            <button class="choice-btn" onclick="makeChoice(1)">
                （转身看向来人）
            </button>
        </div>
    </div>

    <script>
        // 加载游戏状态
        let gameState = JSON.parse(localStorage.getItem('thomaStory_save') || '{}');

        function updateStatus() {
            document.getElementById('aff-display').textContent = gameState.affection || 30;
            document.getElementById('nrg-display').textContent = gameState.energy || 100;
        }

        function saveGame() {
            localStorage.setItem('thomaStory_save', JSON.stringify(gameState));
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function makeChoice(choiceIndex) {
            // 序章的选择
            gameState.affection = (gameState.affection || 30) + (choiceIndex === 1 ? 3 : 0);
            gameState.energy = (gameState.energy || 100) - 5;

            // 进入下一段剧情
            showNextDialog(choiceIndex);
        }

        function showNextDialog(choice) {
            const dialog = document.getElementById('dialog-text');
            const speaker = document.getElementById('speaker-tag');
            const choices = document.getElementById('choices');

            // 显示「点击继续」提示
            choices.innerHTML = '<div style="text-align: center; color: rgba(255,236,209,0.5); cursor: pointer; padding: 1rem;">点击继续...</div>';
            choices.children[0].onclick = function() {
                speaker.textContent = '托马';
                dialog.innerHTML = '「哎呀，是新来的帮手吗？欢迎欢迎！」\n\n金色头发的青年笑着朝你挥了挥手，手里还提着刚买的菜。\n\n他穿着红黑相间的服饰，发间编着几根红色的流苏，眼睛是像猫一样漂亮的碧绿色。\n\n「我叫托马，是这里的家政官。有什么不懂的尽管问我就好！」\n\n他伸手接过你手里的行李，动作自然得像是认识了很久的朋友。\n\n「先别站在门口了，进来吧！我刚泡了新茶，我们边喝边聊。」';

                // 显示选择按钮
                choices.innerHTML = '';
                
                const btn1 = document.createElement('button');
                btn1.className = 'choice-btn';
                btn1.textContent = '「麻烦你了，托马。」';
                btn1.onclick = goToCorridor;
                
                const btn2 = document.createElement('button');
                btn2.className = 'choice-btn';
                btn2.textContent = '（点头，跟着他进去）';
                btn2.onclick = goToCorridor;
                
                choices.appendChild(btn1);
                choices.appendChild(btn2);

                gameState.affection += 2;
                saveGame();
                updateStatus();
            };

            saveGame();
            updateStatus();
        }

        function goToCorridor() {
            gameState.flags.metThoma = true;
            gameState.time = 'noon';
            saveGame();
            window.location.href = 'scene_corridor.html';
        }

        // 初始化
        updateStatus();
    </script>
</body>
</html>
