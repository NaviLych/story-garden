<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庭院 · 托马物语</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <style>
        .scene-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem 5rem;
        }

        .scene-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .scene-title {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .scene-time {
            color: rgba(255, 236, 209, 0.5);
            font-size: 0.9rem;
        }

        .character-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .character-sprite {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .dialog-box {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .name-tag {
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .dialog-text {
            color: var(--accent);
            line-height: 1.8;
            white-space: pre-line;
        }

        .action-grid {
            display: grid;
            gap: 0.8rem;
        }

        .action-btn {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.1), rgba(255, 107, 53, 0.05));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.2), rgba(255, 107, 53, 0.1));
            border-color: rgba(255, 157, 0, 0.6);
            transform: translateX(5px);
        }

        .action-cost {
            font-size: 0.85rem;
            color: #ff9d00;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            font-size: 0.9rem;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .status-mini {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .status-mini span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .map-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            margin-bottom: 1rem;
        }

        .map-btn {
            background: rgba(255, 157, 0, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: var(--accent);
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .map-btn.active {
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            border-color: transparent;
        }

        .map-btn:hover:not(.active) {
            background: rgba(255, 157, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div class="scene-container">
        <div class="top-bar">
            <button class="back-btn" onclick="goToScene('corridor')">← 返回走廊</button>
            <div class="status-mini">
                <span>❤️ <span id="aff-display">30</span></span>
                <span>⚡ <span id="nrg-display">100</span></span>
            </div>
        </div>

        <div class="map-nav">
            <button class="map-btn" onclick="goToScene('corridor')">🏡 走廊</button>
            <button class="map-btn active">🌿 庭院</button>
            <button class="map-btn" onclick="goToScene('kitchen')">🍱 厨房</button>
            <button class="map-btn" onclick="goToScene('street')">🏮 街头</button>
        </div>

        <div class="scene-header">
            <h1 class="scene-title">社奉行邸 · 庭院</h1>
            <p class="scene-time" id="time-display">午后</p>
        </div>

        <div class="character-area">
            <img src="../../assets/images/tohma_garden.jpg" alt="托马在庭院" class="character-sprite">
        </div>

        <div class="dialog-box">
            <div class="name-tag">托马</div>
            <div class="dialog-text" id="main-dialog">
                「来，这边走。」

庭院里种着几棵老樱花树，风一吹，花瓣就像下雪一样飘下来。

托马忽然停下脚步，做了个「嘘」的手势——树下的草丛里，几只橘色的小奶猫正挤在一起晒太阳。

「它们的妈妈上个月走了，现在就剩这几只小家伙。」

他放轻脚步走过去，从口袋里摸出一小包鱼干，小心地放在小猫们旁边。
            </div>
        </div>

        <div class="action-grid" id="action-list">
        </div>
    </div>

    <script>
        let gameState = JSON.parse(localStorage.getItem('thomaStory_save') || '{}');

        function updateUI() {
            document.getElementById('aff-display').textContent = gameState.affection || 30;
            document.getElementById('nrg-display').textContent = gameState.energy || 100;
            document.getElementById('time-display').textContent = gameState.time === 'evening' ? '傍晚' : '午后';
        }

        function saveGame() {
            localStorage.setItem('thomaStory_save', JSON.stringify(gameState));
        }

        function goToScene(scene) {
            window.location.href = `scene_${scene}.html`;
        }

        function showActions() {
            const actions = document.getElementById('action-list');
            const dialog = document.getElementById('main-dialog');
            
            if (!gameState.flags.gardenVisited) {
                // 第一次来庭院
                const options = [
                    { text: '蹲下来一起喂小猫', aff: 5, key: 'feed' },
                    { text: '「你经常来喂它们吗？」', aff: 3, key: 'ask' },
                    { text: '「好可爱……我能摸摸吗？」', aff: 8, key: 'touch' }
                ];
                
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.innerHTML = `<span>${opt.text}</span><span class="action-cost">❤️ +${opt.aff}</span>`;
                    btn.onclick = () => gardenChoice(opt);
                    actions.appendChild(btn);
                });
            } else {
                // 已经来过了
                dialog.innerHTML = '阳光透过樱花树洒在庭院里。\n\n小猫们还在树下睡着，偶尔有一片花瓣落在它们身上。\n\n托马靠在树干上看着你，嘴角带着温和的笑意。';
                
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerHTML = '<span>回走廊继续喝茶</span><span class="action-cost">→</span>';
                btn.onclick = () => goToScene('corridor');
                actions.appendChild(btn);
            }
        }

        function gardenChoice(opt) {
            const dialog = document.getElementById('main-dialog');
            const actions = document.getElementById('action-list');
            
            gameState.affection += opt.aff;
            gameState.flags.gardenVisited = true;
            
            let response = '';
            switch(opt.key) {
                case 'feed':
                    response = '你蹲下来，小心地拿起一块鱼干递到小猫面前。\n\n最小的那只橘猫怯生生地嗅了嗅，然后一口叼住，跑到一边狼吞虎咽起来。\n\n托马也蹲下来，伸手轻轻挠了挠大猫的下巴：「还是你最乖，不像这几个小调皮，看见我就跑。」\n\n夕阳把你们的影子拉得很长，小猫们围在你们脚边蹭来蹭去。';
                    break;
                case 'ask':
                    response = '「嗯，差不多每天都会来看看。」\n\n托马坐在石阶上，看着小猫们吃东西：「刚来稻妻的时候，我也是这样……无家可归，只能在神社旁边蹭吃蹭喝。」\n\n他笑了笑，伸手接住一片飘下来的花瓣：「那时候有只老橘猫陪着我，跟它们长得一模一样。」\n\n「所以现在，就当是还债啦。」';
                    break;
                case 'touch':
                    response = '「当然可以，它们很乖的。」\n\n托马拉着你的手腕，轻轻把你的手递到小猫面前。他的手心温暖干燥，带着一点皂角的香气。\n\n小猫蹭了蹭你的手心，毛茸茸的触感让你忍不住笑出声。\n\n托马在旁边看着你，眼睛弯成了好看的弧度：「你看，它们也喜欢你呢。」';
                    gameState.flags.pettedCats = true;
                    break;
            }
            
            dialog.innerHTML = response;
            
            actions.innerHTML = '';
            const nextBtn = document.createElement('button');
            nextBtn.className = 'action-btn';
            nextBtn.innerHTML = '<span>（天色渐晚，返回走廊）</span><span class="action-cost">→</span>';
            nextBtn.onclick = () => {
                gameState.time = 'evening';
                saveGame();
                goToScene('corridor');
            };
            actions.appendChild(nextBtn);
            
            saveGame();
            updateUI();
        }

        // 初始化
        updateUI();
        showActions();
    </script>
</body>
</html>
