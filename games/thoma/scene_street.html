<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>街头 · 托马物语</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <style>
        .scene-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem 5rem;
        }

        .scene-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .scene-title {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .scene-time {
            color: rgba(255, 236, 209, 0.5);
            font-size: 0.9rem;
        }

        .character-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .character-sprite {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .dialog-box {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .name-tag {
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .dialog-text {
            color: var(--accent);
            line-height: 1.8;
            white-space: pre-line;
        }

        .action-grid {
            display: grid;
            gap: 0.8rem;
        }

        .action-btn {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.1), rgba(255, 107, 53, 0.05));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.2), rgba(255, 107, 53, 0.1));
            border-color: rgba(255, 157, 0, 0.6);
            transform: translateX(5px);
        }

        .action-cost {
            font-size: 0.85rem;
            color: #ff9d00;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            font-size: 0.9rem;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .status-mini {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .status-mini span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .map-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            margin-bottom: 1rem;
        }

        .map-btn {
            background: rgba(255, 157, 0, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: var(--accent);
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .map-btn.active {
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            border-color: transparent;
        }

        .map-btn:hover:not(.active) {
            background: rgba(255, 157, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div class="scene-container">
        <div class="top-bar">
            <button class="back-btn" onclick="goToScene('corridor')">← 返回走廊</button>
            <div class="status-mini">
                <span>❤️ <span id="aff-display">30</span></span>
                <span>⚡ <span id="nrg-display">100</span></span>
            </div>
        </div>

        <div class="map-nav">
            <button class="map-btn" onclick="goToScene('corridor')">🏡 走廊</button>
            <button class="map-btn" onclick="goToScene('garden')">🌿 庭院</button>
            <button class="map-btn" onclick="goToScene('kitchen')">🍱 厨房</button>
            <button class="map-btn active">🏮 街头</button>
        </div>

        <div class="scene-header">
            <h1 class="scene-title">鸣神岛 · 午后街头</h1>
            <p class="scene-time" id="time-display">午后</p>
        </div>

        <div class="character-area">
            <img src="../../assets/images/tohma_street.jpg" alt="托马在街头" class="character-sprite">
        </div>

        <div class="dialog-box">
            <div class="name-tag">托马</div>
            <div class="dialog-text" id="main-dialog">
                鸣神岛的街头总是热热闹闹的。

小吃摊冒着热气，店家的吆喝声此起彼伏，路过的行人三三两两地聊着天。

托马熟稔地和每一个店家打招呼，从果蔬摊老板那里接过一袋新鲜的野菜，又被团子店的老板娘塞了两串三彩团子。

「哈哈，谢谢阿姨！」他笑着接过团子，转头递给你一串：「来，这个超好吃，我从小吃到大。」
            </div>
        </div>

        <div class="action-grid" id="action-list">
        </div>
    </div>

    <script>
        let gameState = JSON.parse(localStorage.getItem('thomaStory_save') || '{}');

        function updateUI() {
            document.getElementById('aff-display').textContent = gameState.affection || 30;
            document.getElementById('nrg-display').textContent = gameState.energy || 100;
            document.getElementById('time-display').textContent = gameState.time === 'evening' ? '傍晚' : '午后';
        }

        function saveGame() {
            localStorage.setItem('thomaStory_save', JSON.stringify(gameState));
        }

        function goToScene(scene) {
            window.location.href = `scene_${scene}.html`;
        }

        function showActions() {
            const actions = document.getElementById('action-list');
            const dialog = document.getElementById('main-dialog');
            
            if (!gameState.flags.streetVisited) {
                const options = [
                    { text: '接过团子咬一口', aff: 4, key: 'eat' },
                    { text: '「你好像和这里的人都很熟。」', aff: 3, key: 'ask' },
                    { text: '「我们去那边的小吃摊看看吧！」', aff: 6, key: 'explore' }
                ];
                
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.innerHTML = `<span>${opt.text}</span><span class="action-cost">❤️ +${opt.aff}</span>`;
                    btn.onclick = () => streetChoice(opt);
                    actions.appendChild(btn);
                });
            } else {
                dialog.innerHTML = '街头还是那么热闹。\n\n路过团子店的时候，老板娘笑着朝你们挥了挥手，又要递团子过来。\n\n托马连忙摆手谢绝，但是被硬塞了两个揣在怀里。\n\n「……她说给'媳妇'吃的。」他耳尖微红，把还热乎的团子递给你。';
                
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerHTML = '<span>带着团子回社奉行</span><span class="action-cost">→</span>';
                btn.onclick = () => {
                    gameState.time = 'evening';
                    saveGame();
                    goToScene('corridor');
                };
                actions.appendChild(btn);
            }
        }

        function streetChoice(opt) {
            const dialog = document.getElementById('main-dialog');
            const actions = document.getElementById('action-list');
            
            gameState.affection += opt.aff;
            gameState.flags.streetVisited = true;
            
            let response = '';
            switch(opt.key) {
                case 'eat':
                    response = '你接过团子咬了一口。\n\n软糯的糯米包裹着香甜的豆沙，好吃得眼睛都眯了起来。\n\n「对吧对吧！」托马看着你满足的样子，笑得比自己吃到好吃的还开心：「我就知道你会喜欢！」\n\n他自己也咬了一口，粉色的团子沾了一点在嘴角，你忍不住伸手帮他擦掉了。\n\n托马愣了一下，然后耳尖唰地红了。';
                    break;
                case 'ask':
                    response = '「哈哈，毕竟在稻妻待了这么多年嘛。」\n\n他挠了挠头：「刚来的时候语言不通，也没地方去，就天天在街上晃悠，帮店家们跑跑腿什么的。」\n\n「一来二去就熟了——其实稻妻人都挺好的，只是看起来严肃而已。」\n\n正说着，卖鱼的老板大老远就喊：「托马！今天的鲷鱼特别新鲜！带一条回去啊！」\n\n你笑着看向他：「看起来确实挺好的。」';
                    break;
                case 'explore':
                    response = '「好啊！」\n\n托马拉着你的手穿梭在热闹的街道上，像个兴奋的导游一样给你介绍每一个摊位。\n\n「这个章鱼小丸子超好吃！还有那个，稻妻特色的狐狸面具——你要一个吗？」\n\n他给你买了一个白色的狐狸面具，亲手帮你戴上，然后后退两步打量着你，眼睛亮晶晶的：「……好看。」\n\n傍晚的风吹动灯笼，街道上灯火渐次亮起，你们一人拿着一串团子，在逐渐亮起的灯火中慢慢往回走。';
                    gameState.flags.gotMask = true;
                    break;
            }
            
            dialog.innerHTML = response;
            
            actions.innerHTML = '';
            const nextBtn = document.createElement('button');
            nextBtn.className = 'action-btn';
            nextBtn.innerHTML = '<span>（天色渐暗，返回社奉行）</span><span class="action-cost">→</span>';
            nextBtn.onclick = () => {
                gameState.time = 'evening';
                saveGame();
                goToScene('corridor');
            };
            actions.appendChild(nextBtn);
            
            saveGame();
            updateUI();
        }

        // 初始化
        updateUI();
        showActions();
    </script>
</body>
</html>
