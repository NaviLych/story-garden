<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>厨房 · 托马物语</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <style>
        .scene-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem 5rem;
        }

        .scene-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .scene-title {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .scene-time {
            color: rgba(255, 236, 209, 0.5);
            font-size: 0.9rem;
        }

        .character-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .character-sprite {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .dialog-box {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .name-tag {
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .dialog-text {
            color: var(--accent);
            line-height: 1.8;
            white-space: pre-line;
        }

        .action-grid {
            display: grid;
            gap: 0.8rem;
        }

        .action-btn {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.1), rgba(255, 107, 53, 0.05));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, rgba(255, 157, 0, 0.2), rgba(255, 107, 53, 0.1));
            border-color: rgba(255, 157, 0, 0.6);
            transform: translateX(5px);
        }

        .action-cost {
            font-size: 0.85rem;
            color: #ff9d00;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            font-size: 0.9rem;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .status-mini {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .status-mini span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .map-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            margin-bottom: 1rem;
        }

        .map-btn {
            background: rgba(255, 157, 0, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: var(--accent);
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .map-btn.active {
            background: linear-gradient(90deg, #ff6b35, #ff9d00);
            border-color: transparent;
        }

        .map-btn:hover:not(.active) {
            background: rgba(255, 157, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div class="scene-container">
        <div class="top-bar">
            <button class="back-btn" onclick="goToScene('corridor')">← 返回走廊</button>
            <div class="status-mini">
                <span>❤️ <span id="aff-display">30</span></span>
                <span>⚡ <span id="nrg-display">100</span></span>
            </div>
        </div>

        <div class="map-nav">
            <button class="map-btn" onclick="goToScene('corridor')">🏡 走廊</button>
            <button class="map-btn" onclick="goToScene('garden')">🌿 庭院</button>
            <button class="map-btn active">🍱 厨房</button>
            <button class="map-btn" onclick="goToScene('street')">🏮 街头</button>
        </div>

        <div class="scene-header">
            <h1 class="scene-title">社奉行邸 · 厨房</h1>
            <p class="scene-time" id="time-display">午后</p>
        </div>

        <div class="character-area">
            <img src="../../assets/images/tohma_kitchen.jpg" alt="托马在厨房" class="character-sprite">
        </div>

        <div class="dialog-box">
            <div class="name-tag">托马</div>
            <div class="dialog-text" id="main-dialog">
                一进厨房，就闻到了暖暖的香气。

托马正系着围裙站在灶台前，手里拿着锅铲，锅里的味增汤正咕嘟咕嘟冒着泡。

「哎呀，你怎么来了？」他回头看到你，眼睛亮了一下：「刚好，我正在做晚饭，要不要尝尝我的手艺？」

他掀开锅盖，蒸汽带着鲜美的香气扑面而来。
            </div>
        </div>

        <div class="action-grid" id="action-list">
        </div>
    </div>

    <script>
        let gameState = JSON.parse(localStorage.getItem('thomaStory_save') || '{}');

        function updateUI() {
            document.getElementById('aff-display').textContent = gameState.affection || 30;
            document.getElementById('nrg-display').textContent = gameState.energy || 100;
            document.getElementById('time-display').textContent = gameState.time === 'evening' ? '傍晚' : '午后';
        }

        function saveGame() {
            localStorage.setItem('thomaStory_save', JSON.stringify(gameState));
        }

        function goToScene(scene) {
            window.location.href = `scene_${scene}.html`;
        }

        function showActions() {
            const actions = document.getElementById('action-list');
            const dialog = document.getElementById('main-dialog');
            
            if (!gameState.flags.kitchenVisited) {
                const options = [
                    { text: '「好啊，我来帮你！」', aff: 6, key: 'help' },
                    { text: '「真的可以吗？那就不客气了~」', aff: 3, key: 'taste' },
                    { text: '站在旁边看他做饭', aff: 4, key: 'watch' }
                ];
                
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.innerHTML = `<span>${opt.text}</span><span class="action-cost">❤️ +${opt.aff}</span>`;
                    btn.onclick = () => kitchenChoice(opt);
                    actions.appendChild(btn);
                });
            } else {
                dialog.innerHTML = '厨房里还留着晚饭的香气。\n\n碗筷都已经洗干净收好了，灶台也擦得一尘不染——不愧是家政官托马。\n\n灶上温着一壶茶，旁边还放着一小碟樱饼，明显是留给你的。';
                
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerHTML = '<span>端着茶点回走廊</span><span class="action-cost">→</span>';
                btn.onclick = () => goToScene('corridor');
                actions.appendChild(btn);
            }
        }

        function kitchenChoice(opt) {
            const dialog = document.getElementById('main-dialog');
            const actions = document.getElementById('action-list');
            
            gameState.affection += opt.aff;
            gameState.flags.kitchenVisited = true;
            
            let response = '';
            switch(opt.key) {
                case 'help':
                    response = '「真的吗？太好了！」\n\n托马眼睛一下子亮了，转身给你拿了条围裙：「来，帮我切一下豆腐就好——小心手哦，这个刀很快的。」\n\n你们两个人在厨房里忙碌着，他会时不时指点你切菜的技巧，偶尔不小心碰到手，两个人都会愣一下，然后相视一笑。\n\n「……说起来，好久没有人和我一起做饭了。」他一边搅拌着锅里的汤，一边轻声说：「这种感觉……还挺好的。」';
                    gameState.flags.cookedTogether = true;
                    break;
                case 'taste':
                    response = '「当然可以！」\n\n他立刻盛了一小碗味增汤，吹了吹才递给你：「小心烫，刚出锅的。」\n\n你喝了一口——鲜美又温暖，是让人想家的味道。\n\n「怎么样？」他有点紧张地看着你，像个等待评分的学生。\n\n看到你点头称赞，他立刻笑开了：「太好了！那……晚上留下一起吃饭吧？我再炸个天妇罗！」';
                    break;
                case 'watch':
                    response = '你靠在门框上，安静地看着他做饭。\n\n托马做饭的时候很认真，眼神专注，动作熟练又利落。夕阳从窗户照进来，给他的金发镀上了一层暖金色的边。\n\n他似乎察觉到你在看他，回头笑了笑：「看什么呢？」\n\n「看你。」你如实说。\n\n他愣了一下，然后耳尖慢慢变红，轻咳一声转过头去：「……再看就要收费了啊。」';
                    break;
            }
            
            dialog.innerHTML = response;
            
            actions.innerHTML = '';
            const nextBtn = document.createElement('button');
            nextBtn.className = 'action-btn';
            nextBtn.innerHTML = '<span>（吃完晚饭，返回走廊）</span><span class="action-cost">→</span>';
            nextBtn.onclick = () => {
                gameState.time = 'evening';
                saveGame();
                goToScene('corridor');
            };
            actions.appendChild(nextBtn);
            
            saveGame();
            updateUI();
        }

        // 初始化
        updateUI();
        showActions();
    </script>
</body>
</html>
