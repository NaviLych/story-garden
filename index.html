<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故事花园 🍁 Story Garden</title>
    <link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
    <!-- 装饰光效 -->
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <!-- 页面头部 -->
    <header class="page-header">
        <h1 class="page-title">🍁 故事花园</h1>
        <p class="page-subtitle">收集每一个温暖的瞬间</p>
    </header>

    <!-- 故事卡片网格 -->
    <main class="story-grid">
        <!-- 托马的茶会 -->
        <a href="stories/tohma-tea.html" class="story-card">
            <img src="assets/images/tohma-main.jpg" alt="托马的茶会" class="story-card-image">
            <div class="story-card-content">
                <h2 class="story-card-title">稻妻午后 · 与托马的茶会</h2>
                <p class="story-card-desc">
                    在社奉行邸的走廊上，与托马共度一个安静的午后。
                    枫叶飘落，茶香四溢，有些话，只说给懂的人听。
                </p>
                <div class="story-card-meta">
                    <span class="story-card-tag">原神</span>
                    <span class="story-card-tag">多分支</span>
                    <span class="story-card-tag">好感度</span>
                </div>
            </div>
        </a>

        <!-- 托马物语 -->
        <a href="games/thoma/index.html" class="story-card">
            <img src="assets/images/tohma-main.jpg" alt="托马物语" class="story-card-image">
            <div class="story-card-content">
                <h2 class="story-card-title">🍁 托马物语</h2>
                <p class="story-card-desc">
                    在社奉行邸的日常，与托马相遇的故事。
                    时间系统、精力系统、多分支剧情、物品收集。
                </p>
                <div class="story-card-meta">
                    <span class="story-card-tag">原神</span>
                    <span class="story-card-tag">养成</span>
                    <span class="story-card-tag">互动游戏</span>
                </div>
            </div>
        </a>

        <!-- 占位卡片 - 待开发 -->
        <div class="story-card" style="opacity: 0.6;">
            <div style="width: 100%; height: 220px; background: linear-gradient(135deg, #2d1810, #1a0f0a); display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--border-color);">
                <span style="font-size: 3rem; opacity: 0.3;">✨</span>
            </div>
            <div class="story-card-content">
                <h2 class="story-card-title">敬请期待...</h2>
                <p class="story-card-desc">
                    更多故事正在编写中，下一个会是谁的故事呢？
                </p>
                <div class="story-card-meta">
                    <span class="story-card-tag">即将到来</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="page-footer">
        <p>🌱 Story Garden · 用故事温暖时光</p>
    </footer>
</body>
</html>
